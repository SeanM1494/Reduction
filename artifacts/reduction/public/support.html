<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support — Recipe Reduction</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="/brand/reduction-icon.svg">
  <style>
    :root { color-scheme: light dark; --ink:#211d18; --muted:#6b6154; --page:#e8d5b2; --card:#fffdf6; --line:#e4d6b8; --link:#5b6d47; }
    @media (prefers-color-scheme: dark) { :root { --ink:#ece6d9; --muted:#b3a898; --page:#131110; --card:#2a2622; --line:#3d362f; --link:#a9bd8c; } }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
    article { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 26px 0 8px; }
    p, li { margin: 0 0 10px; }
    ul { padding-left: 20px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    a { color: var(--link); text-underline-offset: 2px; }
    nav a { display: inline-block; min-height: 44px; line-height: 44px; margin-right: 18px; }
    .brand { font-weight: 600; text-decoration: none; color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Legal"><a class="brand" href="/">Recipe Reduction</a><a href="/privacy.html">Privacy Policy</a><a href="/terms.html">Terms of Use</a></nav>
    <article>
      <h1>Support</h1>

      <p>Need help with Reduction, or found something wrong? Write to <a href="mailto:admin@recipereduction.com">admin@recipereduction.com</a>. In the app, Settings › Send feedback fills in your app version for you.</p>

    </article>
  </main>
</body>
</html>
