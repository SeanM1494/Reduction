<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe2c8" />
    <meta
      name="description"
      content="Turn any recipe into one clear diagram you can cook from. Paste a link and try it free."
    />
    <title>Reduction: recipes as diagrams you can cook from</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reduction" />
    <meta property="og:title" content="Reduction: recipes as diagrams you can cook from" />
    <meta
      property="og:description"
      content="Every ingredient beside the step that uses it, and the next step lit up. Paste a recipe link and try it free."
    />
    <meta property="og:url" content="https://recipereduction.com/" />
    <meta property="og:image" content="https://recipereduction.com/brand/reduction-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem("logic-cooking:theme:v1");
          var mode = raw === "light" || raw === "dark" || raw === "colorblind" ? raw : null;
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var base = mode === "dark" ? "dark" : mode === "light" ? "light" : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", base);
          if (mode === "colorblind") root.setAttribute("data-colorblind", "true");
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/brand/reduction-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/reduction-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/reduction-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
