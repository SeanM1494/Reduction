<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0E2C8" />
    <meta
      name="description"
      content="Turn any recipe into a diagram that shows what mixes into what."
    />
    <title>Reduction</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem("logic-cooking:theme:v1");
          var mode = raw === "light" || raw === "dark" || raw === "colorblind" ? raw : null;
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var base = mode === "dark" ? "dark" : mode === "light" ? "light" : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", base);
          if (mode === "colorblind") root.setAttribute("data-colorblind", "true");
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/brand/reduction-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/reduction-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/reduction-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
