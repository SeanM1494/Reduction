<title>Opening sequence - interactive prototype</title>
<!--
  OPENING SEQUENCE - REFERENCE PROTOTYPE (approved design, v4)

  Purpose: the source of truth for how the opening sequence should LOOK and
  FEEL. It is a behaviour reference, not code to port. Build the real thing
  natively and match it.

  How to use it: open in Chromium (any phone profile, or a desktop window).
  The phone-shaped stage is a fixed 240 x 506 px, which is a 9:19 screen.
  Real devices have other aspect ratios (iPhone SE is about 9:16), so the
  real build must compute the zoom and reveal sizes from the actual screen.

  Controls:
    - Version: Full (first launch, 4.3 s) and Quick (later launches, 2.2 s).
    - Scrubber, Play/Pause, Replay. Tap the phone to skip to the end.
    - Where it lands: the three destinations from the handoff.
    - Reduce motion: a short crossfade instead of the animation.

  Timeline (seconds), read from the F and Q objects in the script:
    Full:  shaker/bottle tip in 0.2-0.7, spice pours 0.6-2.15, vinegar
           0.8-2.1, bubbling from 1.0, shaker/bottle leave 2.1-2.6,
           camera rises to look into the pot 2.2-3.0, dive (zoom) 2.7-3.7,
           bubble-pop reveal 3.45-4.15, end 4.3.
    Quick: the same beats compressed: tip in 0.05-0.35, spice 0.25-1.1,
           vinegar 0.35-1.3, bubbling from 0.3, leave 0.85-1.15, camera
           0.95-1.4, dive 1.2-1.8, reveal 1.55-2.05, end 2.2.

  Deliberate stand-ins that are NOT part of the spec:
    - The three destination screens are rough pictures, not the real screens.
    - Particle positions are pseudo-random from a fixed seed, so every play
      looks the same. The real build should keep that: deterministic.
    - Everything is a function of one time value t, which is why the
      scrubber works. The real build should keep that structure.

  Artwork: shapes and colours match brand/reduction-icon.svg. Reuse the
  repo's copy of the artwork; do not redraw it from this file.
-->

.sq .lbl{font-size:13px;color:var(--text-muted);margin:14px 0 6px;text-align:center}

}
var rs=g('q_rs'),tm=g('q_tm'),pl=g('q_play'),rm=g('q_rm');
var modeBtns=[['full','Full: first launch'],['quick','Quick: later launches']].map(function(m){var bt=document.createElement('button');bt.className='b';bt.textContent=m[1];bt.onclick=function(){mode=m[0];t=0;playing=true;rs.max=Math.round(total()*1000);sync();};g('q_modes').appendChild(bt);return {b:bt,k:m[0]};});
var dstBtns=['Returning user','New or signed out','Signed in, no recipes'].map(function(n,idx){var bt=document.createElement('button');bt.className='b';bt.textContent=n;bt.onclick=function(){dst=idx;dest.innerHTML=mocks[idx];sync();};g('q_dsts').appendChild(bt);return bt;});
function sync(){modeBtns.forEach(function(m){m.b.className='b'+(mode===m.k?' on':'');});dstBtns.forEach(function(b,n){b.className='b'+(dst===n?' on':'');});rm.className='b'+(reduce?' on':'');rm.textContent='Reduce motion: '+(reduce?'on':'off');}
g('q_re').onclick=function(){t=0;playing=true;};
pl.onclick=function(){if(t>=total()){t=0;}playing=!playing;};
rs.oninput=function(){playing=false;t=rs.value/1000;};
rm.onclick=function(){reduce=!reduce;t=0;playing=true;rs.max=Math.round(total()*1000);sync();};
stage.onclick=function(){t=total();playing=false;};
sync();rs.max=Math.round(total()*1000);
var last=performance.now();
function tick(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 if(playing){t+=dt;if(t>=total()){t=total();playing=false;}}
 frame(t);rs.value=Math.round(t*1000);tm.textContent=t.toFixed(1)+' / '+total().toFixed(1)+'s';pl.textContent=playing?'Pause':'Play';
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
